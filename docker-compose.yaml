# SOF-ELK dockerized stack.
# Images are pinned by tag + digest (immutable). Bump = pull new tag, re-resolve
# digest with `docker buildx imagetools inspect <ref>`, update line + comment.
# ELK line: 9.4.3 (Elasticsearch / Kibana / Logstash / Filebeat kept in lockstep).

services:

    # Used as load balancer and frontend domain parser
    traefik:
        image: traefik:3.7.7@sha256:1cb3845d7a05e1473c9086351426597e911db49db382b6e4769f9b0744962ac8 # pinned 2026-07-14
        command: --configFile=/traefik.toml
        ports:
            - "80:80"     # The HTTP port
            - "443:443"   # The HTTPS port
            - "8080:8080" # The Web UI (enabled by api.insecure in traefik.toml)
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./traefik/${TRAEFIK_CONFIG:-traefik_dev.toml}:/traefik.toml
            - ./traefik/acme.json:/acme.json
        networks:
            - master

    # ELK
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3@sha256:851ff5f9615ab7d2f00931114f6db32850f0208ec9fe7e841f135ac78f5f13d5 # pinned 2026-07-14
        volumes:
            # for persistent data
            - ./elasticsearch-data:/usr/share/elasticsearch/data
            - ./elk_config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
        ports:
            - 9200:9200
            - 9300
        environment:
            # ES 9 needs a real heap; 256m from the 6.x era will not bootstrap.
            ES_JAVA_OPTS: "${ES_HEAP:--Xms2g -Xmx2g}"
        networks:
            - master
        deploy:
            restart_policy:
                condition: on-failure
            resources:
                limits:
                    # heap + off-heap overhead; 1G from the 6.x era OOMs on 9.x.
                    memory: 4G

    logstash:
        # Stock 9.4.3 image plus the plugins the vendored configfiles need, and an
        # entrypoint that assembles the pipeline directory. See docker/logstash/.
        build:
            context: ./docker/logstash
        image: sof-elk-logstash:9.4.3
        volumes:
            - ./elk_config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
            - ./sof-elk:/usr/local/sof-elk:ro
            - ./resources/GeoIP:/usr/local/share/GeoIP
        ports:
            # Ports are internal-only by default. Publish the ones you need by
            # adding a host mapping, e.g. "5514:5514/udp".
            - 5044          # beats, from filebeat
            - 5514/udp      # syslog
            - 5514          # syslog
            - 5516          # relp
            - 5000/udp      # logspout (container logs from this stack)
        environment:
            ELASTICSEARCH_HOSTS: "elasticsearch:9200"
            # -Xss4m is required, not tuning: the vendored pipeline is ~80 files
            # deep and compiling it blows the default 1m JVM thread stack
            # ("Stack overflow error while compiling Pipeline"). Upstream sets the
            # same value in sof-elk/ansible/roles/logstash/tasks/main.yml.
            LS_JAVA_OPTS: "${LS_HEAP:--Xms1g -Xmx1g} -Xss4m"
        networks:
            - master
        depends_on:
            - elasticsearch
        restart: on-failure
        deploy:
            restart_policy:
                condition: on-failure

    # Takes logs from each microservice and pipes into logstash
    # NOTE: bekt/logspout-logstash is unmaintained (last push 2019-06, no semver
    # tags). Pinned by digest to satisfy the pinning invariant. See README for a
    # maintained alternative before relying on this in production.
    logspout:
        # Off by default: `docker compose --profile logspout up -d`. Container
        # logs land in dockerlogs-*, never in the SOF-ELK indices.
        profiles: [ "logspout" ]
        image: bekt/logspout-logstash:latest@sha256:cbe0bd04dc3e65300337c0011ad4322bb476931077e3425d34373730bbbfa59f # pinned 2026-07-14 (unmaintained upstream)
        environment:
            ROUTE_URIS: 'logstash://logstash:5000'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            - logstash
            - elasticsearch
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        networks:
            - master
        restart: on-failure

    kibana:
        image: docker.elastic.co/kibana/kibana:9.4.3@sha256:85e993bf4519827c84faa8a65265028d7ea572385f07ce8d913ad03025327ed7 # pinned 2026-07-14
        volumes:
            - ./elk_config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
            - ./sof-elk:/usr/local/sof-elk:ro
        ports:
            - 5601
        networks:
            - master
        depends_on:
            - elasticsearch
        deploy:
                restart_policy:
                        condition: on-failure
        labels:
            # Traefik v3 dynamic-config labels (router + service model).
            # No entrypoints/tls set here: the router binds all entrypoints, and
            # TLS+certresolver default is applied at the websecure entrypoint in
            # traefik.toml, so the same labels work for dev (http) and prod (https).
            - "traefik.enable=true"
            - "traefik.docker.network=${network_name:-masternetwork}"
            - "traefik.http.routers.kibana.rule=Host(`kibana.${BASE_URL:-localhost}`)"
            - "traefik.http.services.kibana.loadbalancer.server.port=5601"

    # One-shot. Loads the Elasticsearch component/index templates, Kibana data
    # views and saved objects out of the vendored snapshot, then exits. Re-run any
    # time with `docker compose up dashboard-loader`. On the VM this is the tail
    # end of sof-elk/supporting-scripts/post_merge.sh.
    dashboard-loader:
        build:
            context: ./docker/dashboard-loader
        image: sof-elk-dashboard-loader:latest
        volumes:
            - ./sof-elk:/usr/local/sof-elk:ro
        environment:
            ES_HOST: elasticsearch
            KIBANA_HOST: kibana
        networks:
            - master
        depends_on:
            - elasticsearch
            - kibana
        restart: "no"

    filebeat:
        image: docker.elastic.co/beats/filebeat:9.4.3@sha256:61bf789ac881c88c0edee6d490434e7a6d464d5f46a2bb1f5540a2301d4bdec3 # pinned 2026-07-14
        networks:
            - master
        volumes:
            - ./elk_config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
            - ./sof-elk:/usr/local/sof-elk:ro
            - ./filebeat-data:/usr/share/filebeat/data # persistent registry (which files have been read)
            - ./server-files:/logstash # for actual file processing
        environment:
            - ELASTICSEARCH_HOST=elasticsearch
            - KIBANA_HOST=kibana
            - LOGSTASH_HOST=logstash
        restart: on-failure

    # https://github.com/silverwind/droppy
    # Used to drop files that can be immediately picked up by filebeat and sent to logstash
    droppy:
        image: silverwind/droppy:12.2.0@sha256:05aea9527d84d6261075cafe6e4d5c4e576a3911202ec85ab2333b6ea6d5e9a3 # pinned 2026-07-14
        ports:
            - 8989
        volumes:
            # - ./config:./config
            - ./server-files:/files
        restart: unless-stopped
        networks:
            - master
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=${network_name:-masternetwork}"
            - "traefik.http.routers.droppy.rule=Host(`droppy.${BASE_URL:-localhost}`)"
            - "traefik.http.services.droppy.loadbalancer.server.port=8989"


networks:
    # Network mostly needed for swarm
    # Set to bridge to test locally and have ports be outside accessible
    master:
        name: "${network_name:-masternetwork}"
        # overlay for Swarm, bridge for a plain `docker compose up` (the default).
        driver: "${network_driver:-bridge}"
