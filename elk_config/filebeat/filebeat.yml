# https://www.elastic.co/guide/en/beats/filebeat/current/configuration-filebeat-options.html
#
# Mirrors sof-elk/ansible/roles/filebeat/files/filebeat.yml, with the Logstash
# host taken from the environment instead of localhost.
#
# `filebeat.config_dir` was removed in Filebeat 7.x; external input definitions
# load via `filebeat.config.inputs`.

filebeat.config.inputs:
  enabled: true
  path: /usr/local/sof-elk/lib/filebeat_inputs/*.yml
  reload.enabled: true
  reload.period: 30s

#========================== Logstash output ===================================
output.logstash:
  hosts: ["${LOGSTASH_HOST}:5044"]
