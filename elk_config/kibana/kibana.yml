---
## Kibana 9.x configuration for the SOF-ELK lab stack.
#
server.name: kibana
server.host: "0"

## `elasticsearch.url` (a single string) was removed in 7.x in favour of
## `elasticsearch.hosts` (a list). Elasticsearch security is disabled in
## elasticsearch.yml, so no username/password/TLS is needed here.
elasticsearch.hosts: ["http://elasticsearch:9200"]
