# Docker override of sof-elk/configfiles/9900-output-elasticsearch-consolidated.conf.
# Same stanza, plus a `hosts` line: the SOF-ELK VM runs Elasticsearch on
# localhost, this stack runs it in a separate container.
#
# The entrypoint links this file into the pipeline directory under the vendored
# file's name, so this one wins.

output {
  if [sof-elk][base_index] {
    elasticsearch {
      hosts => "${ELASTICSEARCH_HOSTS:elasticsearch:9200}"
      ilm_enabled => false
      index => "%{[sof-elk][base_index]}-%{+YYYY.MM}"
      ecs_compatibility => "disabled"
    }
  }
}
