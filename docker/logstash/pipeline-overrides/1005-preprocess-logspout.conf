# Docker-only addition. Not part of the vendored SOF-ELK snapshot.
#
# Runs after 1000-preprocess-all.conf, which gives every event without a known
# [labels][type] the default base index. Container logs are not forensic source
# data, so send them somewhere else instead of mixing them into logstash-*, which
# is what the SOF-ELK "all-records" and "logstash" data views read.

filter {
  if "logspout" in [tags] {
    mutate {
      replace => { "[sof-elk][base_index]" => "dockerlogs" }
    }
  }
}
