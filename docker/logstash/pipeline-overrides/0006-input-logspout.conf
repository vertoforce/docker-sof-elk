# Docker-only addition. Not part of the vendored SOF-ELK snapshot.
#
# logspout ships this stack's own container logs as JSON over UDP/5000. The
# SOF-ELK VM has no equivalent input, so the listener is declared here.
#
# The listener is always up; the logspout service itself is behind a compose
# profile and is off by default (`docker compose --profile logspout up -d`).

input {
  udp {
    port => 5000
    codec => json
    tags => [ "logspout" ]
  }
}

filter {
  if "logspout" in [tags] {
    # Logstash's own log lines would loop straight back through this input.
    if [docker][image] =~ /logstash/ {
      drop { }
    }
  }
}
